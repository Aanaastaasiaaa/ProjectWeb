<!-- ========== МОДАЛЬНОЕ ОКНО ЗАКАЗА (обновлённое) ========== -->
<div id="orderModal" class="modal">
    <div class="modal-content">
        <button id="closeOrderModal" class="modal-close">×</button>
        <h2>Оформление заказа</h2>

        <form id="orderModalForm">
            <div class="form-group">
                <label>Ваше имя *</label>
                <input type="text" id="orderName" name="name" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Телефон *</label>
                <input type="tel" id="orderPhone" name="phone" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="orderEmail" name="email" class="form-control">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Выберите позицию *</label>
                    <select id="orderProduct" name="product" class="form-control" required>
                        <option value="">-- Выберите --</option>
                        <optgroup label="🍕 Пицца">
                            <option value="Маргарита|450">Маргарита - 450 ₽</option>
                            <option value="Пепперони|550">Пепперони - 550 ₽</option>
                            <option value="Четыре сыра|600">Четыре сыра - 600 ₽</option>
                        </optgroup>
                        <optgroup label="🍝 Паста">
                            <option value="Карбонара|420">Карбонара - 420 ₽</option>
                            <option value="Болоньезе|450">Болоньезе - 450 ₽</option>
                        </optgroup>
                        <optgroup label="🥗 Салаты">
                            <option value="Цезарь|350">Цезарь - 350 ₽</option>
                            <option value="Греческий|320">Греческий - 320 ₽</option>
                        </optgroup>
                        <optgroup label="🥤 Напитки">
                            <option value="Coca-Cola|120">Coca-Cola - 120 ₽</option>
                            <option value="Лимонад|150">Лимонад - 150 ₽</option>
                        </optgroup>
                        <optgroup label="🍰 Десерты">
                            <option value="Тирамису|280">Тирамису - 280 ₽</option>
                            <option value="Чизкейк|250">Чизкейк - 250 ₽</option>
                        </optgroup>
                    </select>
                </div>

                <div class="form-group">
                    <label>Количество</label>
                    <select id="orderQuantity" class="form-control">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Адрес доставки</label>
                <textarea id="orderAddress" name="address" class="form-control" rows="2"></textarea>
            </div>

            <div class="order-summary">
                <h3>Сумма заказа: <span id="orderTotal">0 ₽</span></h3>
            </div>

            <div id="orderMessageContainer"></div>

            <button type="submit" class="btn" style="width:100%">Оформить заказ</button>
        </form>
    </div>
</div>
