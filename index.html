<!-- ========== МОДАЛЬНОЕ ОКНО ЗАКАЗА (с корзиной) ========== -->
<div id="orderModal" class="modal">
    <div class="modal-content" style="max-width: 700px;">
        <button id="closeOrderModal" class="modal-close">×</button>
        <h2>Оформление заказа</h2>

        <form id="orderModalForm">
            <div class="form-group">
                <label>Ваше имя *</label>
                <input type="text" id="orderName" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Телефон *</label>
                <input type="tel" id="orderPhone" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="orderEmail" class="form-control">
            </div>

            <div class="form-group">
                <label>Адрес доставки</label>
                <textarea id="orderAddress" class="form-control" rows="2"></textarea>
            </div>

            <!-- Добавление позиций в заказ -->
            <div class="form-row">
                <div class="form-group" style="flex:2">
                    <label>Добавить позицию</label>
                    <select id="orderProductSelect" class="form-control">
                        <option value="">-- Выберите --</option>
                        <optgroup label="🍕 Пицца">
                            <option value="Маргарита|450">Маргарита - 450 ₽</option>
                            <option value="Пепперони|550">Пепперони - 550 ₽</option>
                            <option value="Четыре сыра|600">Четыре сыра - 600 ₽</option>
                        </optgroup>
                        <optgroup label="🍝 Паста">
                            <option value="Карбонара|420">Карбонара - 420 ₽</option>
                            <option value="Болоньезе|450">Болоньезе - 450 ₽</option>
                        </optgroup>
                        <optgroup label="🥗 Салаты">
                            <option value="Цезарь|350">Цезарь - 350 ₽</option>
                            <option value="Греческий|320">Греческий - 320 ₽</option>
                        </optgroup>
                        <optgroup label="🥤 Напитки">
                            <option value="Coca-Cola|120">Coca-Cola - 120 ₽</option>
                            <option value="Лимонад|150">Лимонад - 150 ₽</option>
                        </optgroup>
                        <optgroup label="🍰 Десерты">
                            <option value="Тирамису|280">Тирамису - 280 ₽</option>
                            <option value="Чизкейк|250">Чизкейк - 250 ₽</option>
                        </optgroup>
                    </select>
                </div>
                <div class="form-group" style="flex:1">
                    <label>Количество</label>
                    <input type="number" id="orderProductQty" class="form-control" value="1" min="1" style="width:100%">
                </div>
                <div class="form-group" style="flex:0.5; display:flex; align-items:flex-end">
                    <button type="button" id="addItemBtn" class="btn" style="width:100%">➕ Добавить</button>
                </div>
            </div>

            <!-- Список выбранных позиций (корзина) -->
            <div class="cart-section">
                <label>Ваш заказ:</label>
                <div id="cartItems" class="cart-items">
                    <div class="cart-empty">Корзина пуста</div>
                </div>
            </div>

            <div class="order-summary">
                <h3>Итого: <span id="orderTotal">0 ₽</span></h3>
            </div>

            <button type="submit" class="btn" style="width:100%">Оформить заказ</button>
        </form>
    </div>
</div>
