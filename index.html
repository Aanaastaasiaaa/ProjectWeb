<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пиццерия - заказ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🍕 Заказ пиццы</h1>

<form id="orderForm">
    <div>
        <label>Ваше имя *</label>
        <input type="text" id="userName" required>
    </div>
    <div>
        <label>Телефон *</label>
        <input type="tel" id="userPhone" required>
    </div>
    <div>
        <label>Email</label>
        <input type="email" id="userEmail">
    </div>
    <div>
        <label>Адрес доставки</label>
        <textarea id="userAddress" rows="2"></textarea>
    </div>

    <h3>Выберите позиции</h3>
    <div id="menuList">
        <!-- сюда загрузится меню -->
    </div>

    <h3>Ваша корзина</h3>
    <div id="cart"></div>
    <div><strong>Итого: <span id="totalPrice">0</span> ₽</strong></div>

    <button type="submit">Оформить заказ</button>
</form>

<!-- Модалка с логином/паролем -->
<div id="credsModal" style="display:none; position:fixed; top:20%; left:50%; transform:translateX(-50%); background:white; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.3); z-index:1000;">
    <h3>Ваши данные для входа</h3>
    <p>Логин: <span id="credsLogin"></span></p>
    <p>Пароль: <span id="credsPassword"></span></p>
    <button onclick="closeCredsModal()">OK</button>
</div>

<script src="script.js"></script>
</body>
</html>
